[package]
name = "hwpedit-engine"
description = "Typed adapter over the rhwp document engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hwpedit-core = { path = "../core" }
rhwp = { path = "../../vendor/rhwp", default-features = false }
serde_json = "1"
# same versions rhwp uses; read the container for the loss guard
cfb = "0.15"
flate2 = "1.0"
zip = { version = "8.5", default-features = false, features = ["deflate"] }
